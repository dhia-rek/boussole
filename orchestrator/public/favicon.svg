<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#FFE97A"/>
      <stop offset="45%"  stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#8A5E00"/>
    </linearGradient>
    <!-- subtle warm glow behind the key -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#D4A017" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4A017" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="13" fill="#0D1117"/>
  <!-- warm glow -->
  <rect width="64" height="64" rx="13" fill="url(#glow)"/>

  <!-- Key — rotated -38° around canvas center (32,32) -->
  <g transform="rotate(-38,32,32)">
    <!-- Bow (ring) — outer circle -->
    <circle cx="18" cy="32" r="12" fill="url(#gold)"/>
    <!-- Bow — inner hole (negative space, like Apple's bite) -->
    <circle cx="18" cy="32" r="6" fill="#0D1117"/>

    <!-- Shaft -->
    <rect x="29" y="28.5" width="25" height="7" rx="3" fill="url(#gold)"/>

    <!-- Tooth 1 (far, taller) -->
    <rect x="46" y="35.5" width="5" height="9" rx="2" fill="url(#gold)"/>
    <!-- Tooth 2 (near, shorter) -->
    <rect x="38" y="35.5" width="4.5" height="6.5" rx="2" fill="url(#gold)"/>
  </g>
</svg>
