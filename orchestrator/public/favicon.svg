<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8b78fb"/>
      <stop offset="55%"  stop-color="#6d5dfb"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#6d5dfb" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6d5dfb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App background -->
  <rect width="64" height="64" rx="13" fill="#0b0b14"/>
  <rect width="64" height="64" rx="13" fill="url(#glow)"/>

  <g fill="none" stroke="url(#indigo)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer airplane window frame -->
    <rect x="16" y="9" width="32" height="46" rx="15" stroke-width="3"/>
    <!-- Inner window pane -->
    <rect x="21" y="14" width="22" height="36" rx="10" stroke-width="2.5"/>
    <!-- Vent latch at the top -->
    <line x1="28.5" y1="20" x2="35.5" y2="20" stroke-width="3"/>
    <!-- Cloud — opportunity beyond the window (flat base, fluffy top) -->
    <path d="M25 40
             h14
             a3.7 3.7 0 0 0 0.3 -7.4
             a5.2 5.2 0 0 0 -10 -2.1
             a4 4 0 0 0 -4.3 9.5
             Z"
          stroke-width="2.5" fill="#6d5dfb" fill-opacity="0.2"/>
  </g>
</svg>
