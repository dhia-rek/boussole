# =============================================================================
# Boussole - Docker Compose Configuration
# =============================================================================

services:
  boussole:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    image: ghcr.io/dhia-rek/boussole:latest
    container_name: boussole
    ports:
      - "3005:3001"
    volumes:
      # Persist database and generated PDFs
      - ./data:/app/data
    environment:
      # Server config
      - NODE_ENV=production
      - PORT=3001

      # Python path (uses system python in container)
      - PYTHON_PATH=/usr/bin/python3

    env_file:
      - path: ./.env
        required: false
    develop:
      watch:
        # Rebuild container when package.json changes
        - path: ./orchestrator/package.json
          action: rebuild
        - path: ./orchestrator/package-lock.json
          action: rebuild
        # Sync source code changes and rebuild inside container
        - path: ./orchestrator/src
          target: /app/orchestrator/src
          action: sync+restart
        - path: ./visa-sponsor-providers
          target: /app/visa-sponsor-providers
          action: sync+restart
        # Sync extractor changes
        - path: ./extractors/hiringcafe/src
          target: /app/extractors/hiringcafe/src
          action: sync+restart
        - path: ./extractors/jobspy
          target: /app/extractors/jobspy
          action: sync+restart
        - path: ./extractors/adzuna
          target: /app/extractors/adzuna
          action: sync+restart
        - path: ./extractors/startupjobs/src
          target: /app/extractors/startupjobs/src
          action: sync+restart
        - path: ./extractors/bravesearch
          target: /app/extractors/bravesearch
          action: sync+restart
        - path: ./extractors/companyats
          target: /app/extractors/companyats
          action: sync+restart
        - path: ./extractors/wellfound
          target: /app/extractors/wellfound
          action: sync+restart
        - path: ./extractors/wttj
          target: /app/extractors/wttj
          action: sync+restart
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

secrets:
  github_token:
    environment: GITHUB_TOKEN

# Volumes for data persistence
volumes:
  data:
